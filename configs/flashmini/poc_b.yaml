# FlashMini PoC Variant B — FLASH
# 3 GatedDeltaNet : 1 full attention, HyperConnection, no PLE.
# Same general MoE capacity/routing as A.
# core ~409M

vocab_size: 50257
d_model: 768
num_layers: 10
num_heads: 6
head_dim: 128
gdn_per_attention: 3   # 3 GDN : 1 attention
max_seq_len: 2048
dropout: 0.0
use_hyperconnection: true
use_ple: false

moe:
  num_experts: 16
  top_k: 2
  shared_experts: 1
  expert_intermediate: 1536
  aux_loss_coef: 0.01

gdn:
  d_state: 128
  d_ffn: 1536
  chunk_size: 64
  use_short_conv: true
  short_conv_kernel: 4

ple:
  enabled: false
  ngram: 3
  vocab_size: 50257
  d_model: 768
  num_heads: 8
  head_dim: 256
  offload: gpu
  working_set_fraction: 1.0