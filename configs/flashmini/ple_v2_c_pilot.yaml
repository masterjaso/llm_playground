# Same backbone/seed/tokens as B pilot; bigram/trigram CPU memory added.
architecture_version: 2
vocab_size: 50257
d_model: 128
num_layers: 4
num_heads: 4
head_dim: 32
gdn_per_attention: 3
max_seq_len: 256
dropout: 0.0
use_hyperconnection: true
use_ple: true
moe:
  num_experts: 4
  top_k: 2
  shared_experts: 1
  expert_intermediate: 256
  aux_loss_coef: 0.01
gdn:
  d_state: 32
  chunk_size: 64
  use_short_conv: true
  short_conv_kernel: 4
ple:
  ngram: 3
  table_size: 32749
  num_heads: 8
  head_dim: 32
  injection_layer: 1
  eos_id: 50256
  gate_init: 0.1
  sparse: true
  offload: cpu
