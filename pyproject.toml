[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashmini"
version = "0.1.0"
description = "FlashMini v3 experimental LLM training track (MoE + GDN + PLE + KVC)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "flashmini contributors"}]
dependencies = [
  "torch>=2.7",
  "transformers>=4.45",
  "datasets>=2.0",
  "safetensors>=0.4",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "pyarrow>=14",
  "lm-eval>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
flashmini = "flashmini.cli:main"
flashmini-data = "flashmini.data_v4.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

